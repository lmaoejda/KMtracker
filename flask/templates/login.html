{% extends "base.html" %}
{% block title %}Entrar · KMtracker{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth__art" style="background-image:url('{{ url_for('static', filename='img/instrument.jpg') }}')">
    <div class="auth__quote">
      <p class="label">Bitácora de campo</p>
      <p>Cada tramo registrado, cada kilómetro tuyo.</p>
    </div>
  </div>

  <form class="auth__panel" method="post" novalidate>
    <p class="label">Acceso</p>
    <h1>Entra a tu bitácora</h1>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@email.com">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">

    <button class="btn primary block" type="submit">Iniciar sesión</button>
    <p class="alt">¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
  </form>
</main>
{% endblock %}
