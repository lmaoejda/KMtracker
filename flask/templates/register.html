{% extends "base.html" %}
{% block title %}Crear cuenta · KMtracker{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth__art" style="background-image:url('{{ url_for('static', filename='img/instrument.jpg') }}')">
    <div class="auth__quote">
      <p class="label">Alta de usuario</p>
      <p>Tus rutas, tus datos. Nadie más ve tu bitácora.</p>
    </div>
  </div>

  <form class="auth__panel" method="post" novalidate>
    <p class="label">Registro</p>
    <h1>Crea tu cuenta</h1>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@email.com">

    <label for="password">Contraseña <span class="hint">(mín. 8 caracteres)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="••••••••">

    <label for="confirm">Repite la contraseña</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="••••••••">

    <button class="btn primary block" type="submit">Crear cuenta</button>
    <p class="alt">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Entra</a></p>
  </form>
</main>
{% endblock %}
